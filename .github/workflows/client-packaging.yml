name: Client Packaging

on:
  workflow_dispatch:
    inputs:
      full_docker_checks:
        description: "Run heavyweight Docker client checks"
        required: false
        type: boolean
        default: false
  pull_request:
    paths:
      - ".github/workflows/client-packaging.yml"
      - ".npmignore"
      - "Makefile"
      - "package-lock.json"
      - "package.json"
      - "clients/**"
      - "packaging/**"
      - "scripts/audit-client-packaging.sh"
      - "scripts/audit-changed-cli-flags.sh"
      - "scripts/audit-release-matrix.mjs"
      - "scripts/docker-check-new-clients.sh"
      - "scripts/publish-client.sh"
      - "scripts/publish-homebrew.sh"
      - "src/**"
      - "tests/**"
  push:
    paths:
      - ".github/workflows/client-packaging.yml"
      - ".npmignore"
      - "Makefile"
      - "package-lock.json"
      - "package.json"
      - "clients/**"
      - "packaging/**"
      - "scripts/audit-client-packaging.sh"
      - "scripts/audit-changed-cli-flags.sh"
      - "scripts/audit-release-matrix.mjs"
      - "scripts/docker-check-new-clients.sh"
      - "scripts/publish-client.sh"
      - "scripts/publish-homebrew.sh"
      - "src/**"
      - "tests/**"

permissions:
  contents: read

concurrency:
  group: client-packaging-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install practical smoke-test toolchains
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential zsh ruby

      - name: Install and audit Node.js development dependencies
        run: |
          set -euo pipefail
          npm ci
          npm audit

      - name: Build native CLI
        run: make clean && make all

      - name: Run package-control audit
        run: scripts/audit-client-packaging.sh

      - name: Run release matrix audit
        run: npm run release:audit

      - name: Audit npm package contents
        run: node scripts/audit-npm-package.mjs

      - name: Run core and shell integration tests
        run: tests/run.sh

  docker-smoke:
    name: Docker client smoke (${{ matrix.client }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        client:
          - perl
          - dotnet
          - java
          - python
          - rust
          - golang
          - cpp
          - fortran
          - zig
          - lua
          - php
          - dart
          - nim
          - crystal
          - r
          - clojure
          - erlang-hex
          - solidity
          - packaging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Run isolated Docker client check
        run: scripts/docker-check-new-clients.sh --only "${{ matrix.client }}"

  docker-full:
    name: Full heavyweight Docker client suite
    if: github.event_name == 'workflow_dispatch' && inputs.full_docker_checks
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Run every default and heavyweight Docker check
        run: scripts/docker-check-new-clients.sh --full

  generated-code:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runtime:
          - nodejs
          - typescript
          - bun
          - deno
          - golang
          - rust
          - dart
          - java
          - python
          - csharp
          - json-schema
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Compile and run generated interface
        run: tests/codegen-docker/run.sh "${{ matrix.runtime }}"
  lockfile-repair-probe:
    name: Generate candidate npm lock (temporary recovery probe)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - name: Generate minimal package-lock repair
        id: repair
        run: |
          set +e
          npm audit fix --package-lock-only --ignore-scripts --no-fund
          repair_rc=$?
          set -e
          audit_rc=0
          npm ls undici --all || true
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" || audit_rc=$?
          cp package-lock.json "$RUNNER_TEMP/package-lock.json"
          sha256sum "$RUNNER_TEMP/package-lock.json"
          printf 'npm-audit-fix-exit=%s\nnpm-audit-exit=%s\n' "$repair_rc" "$audit_rc" > "$RUNNER_TEMP/lock-repair-status.txt"
          echo "repair_exit=$repair_rc" >> "$GITHUB_OUTPUT"
          echo "audit_exit=$audit_rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload generated lock and audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: npm-lock-candidate
          path: |
            ${{ runner.temp }}/package-lock.json
            ${{ runner.temp }}/npm-audit.json
            ${{ runner.temp }}/lock-repair-status.txt
          if-no-files-found: error
          retention-days: 7
      - name: Enforce successful npm lock repair
        if: steps.repair.outputs.repair_exit != '0'
        run: exit 1
      - name: Enforce high-severity audit clearance
        if: steps.repair.outputs.audit_exit != '0'
        run: exit 1

