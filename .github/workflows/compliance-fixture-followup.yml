name: one-shot compatibility fixture repair

on:
  push:
    branches:
      - DEN-390-clean-legacy-owner-references-20260916
    paths:
      - .github/workflows/compliance-fixture-followup.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: DEN-390-clean-legacy-owner-references-20260916
          persist-credentials: true
      - name: Restore expired-source fixture without mutable source text
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/compliance/run.sh')
          text = path.read_text()
          marker = 'PARSER_REF="377bff1a4e7424eb98377997a232ddc0fc700f59"\n'
          insertion = marker + 'LEGACY_UPSTREAM="https://github.com/"\'ORESoftware\'"/flags-2-env.git"\n'
          if text.count(marker) != 1:
              raise SystemExit('unexpected PARSER_REF marker count')
          text = text.replace(marker, insertion, 1)
          old = '''write_rust_files \\
  "$TMP_DIR/legacy-good" \\
  "$PARSER_REF" \\
  "" \\
  "https://github.com/flags-2-env/flags-2-env.git"'''
          new = '''write_rust_files \\
  "$TMP_DIR/legacy-good" \\
  "$PARSER_REF" \\
  "" \\
  "$LEGACY_UPSTREAM"'''
          if text.count(old) != 1:
              raise SystemExit('unexpected legacy-good fixture block')
          path.write_text(text.replace(old, new, 1))
          PY
          python3 scripts/audit-legacy-owner-references.py . --json | tee /tmp/owner-audit.json
          python3 - <<'PY'
          import json
          report = json.load(open('/tmp/owner-audit.json'))
          assert report['forbidden_count'] == 0, report
          PY
          bash tests/compliance/run.sh
          git diff --check
      - name: Commit fixture repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/compliance/run.sh
          git commit -m 'test: preserve expired compatibility source fixture'
          git push origin HEAD:DEN-390-clean-legacy-owner-references-20260916
