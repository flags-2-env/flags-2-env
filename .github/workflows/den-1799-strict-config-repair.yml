name: DEN-1799 strict config repair

on:
  push:
    branches:
      - feat/DEN-1799-strict-cli-flags-contract
    paths:
      - 'maintenance/DEN-1799/apply-strict-config-audit.mjs'
      - '.github/workflows/den-1799-strict-config-repair.yml'

permissions:
  contents: write

jobs:
  apply-test-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Apply deterministic native parser hardening
        run: node maintenance/DEN-1799/apply-strict-config-audit.mjs
      - name: Verify every vendored native parser is synchronized
        run: python3 scripts/verify-client-parser-sync.py
      - name: Run native parser and audit suite
        run: make test
      - name: Run Rust binding and build-contract tests
        run: |
          cargo test --manifest-path clients/rust/Cargo.toml
          cargo test --manifest-path clients/rust-build/Cargo.toml
      - name: Remove one-shot repair machinery
        run: |
          rm maintenance/DEN-1799/apply-strict-config-audit.mjs
          rmdir maintenance/DEN-1799 2>/dev/null || true
          rm .github/workflows/den-1799-strict-config-repair.yml
      - name: Verify patch hygiene
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git status --short
          test -n "$(git status --short)"
      - name: Commit and push tested patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ORESoftware'
          git config user.email '11139560+ORESoftware@users.noreply.github.com'
          # Stage only the reviewed source/test changes. `make test` deliberately
          # mutates ignored build outputs and may create an untracked Cargo.lock;
          # those are execution evidence, not source changes, and must never be
          # swept into a commit.
          git add -- \
            src/parser.c \
            tests/run.sh \
            clients/cpp/native/parser.c \
            clients/csharp/native/parser.c \
            clients/elixir/native/parser.c \
            clients/erlang/c_src/parser.c \
            clients/fortran/src/parser.c \
            clients/fsharp/native/parser.c \
            clients/golang/parser.c \
            clients/java/native/parser.c \
            clients/matlab/native/parser.c \
            clients/r/src/parser.c \
            clients/rust/native/parser.c \
            clients/zig/native/parser.c
          git add -u -- \
            maintenance/DEN-1799/apply-strict-config-audit.mjs \
            .github/workflows/den-1799-strict-config-repair.yml
          git diff --cached --check
          git commit -m 'DEN-1799: reject unknown cli-flags config entries'
          git push origin "HEAD:${GITHUB_REF_NAME}"
