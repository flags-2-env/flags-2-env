name: DEN-391 env-only compliance migration

on:
  push:
    branches:
      - DEN-391-env-only-argv-false
    paths:
      - .github/workflows/den-391-compliance-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: DEN-391-env-only-argv-false
          persist-credentials: true
      - name: Teach compliance policy about argv=false
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, got {count}")
              return text.replace(old, new, 1)

          path = Path('scripts/verify-consumer-compliance.py')
          text = path.read_text()
          text = replace_once(
              text,
              'immutable pins, strict unknown-option handling, secret-only environment\nvariables staying out of the flag surface, and trusted contract discovery for\n',
              'immutable pins, strict unknown-option handling, secret-bearing environment\nvariables requiring argv=false, and trusted contract discovery for\n',
              'policy docstring',
          )
          text = replace_once(
              text,
              'class Flag:\n    path: str\n    env: str\n    default_present: bool\n',
              'class Flag:\n    path: str\n    env: str\n    default_present: bool\n    argv_enabled: bool = True\n',
              'Flag metadata',
          )
          text = replace_once(
              text,
              '                yield Flag(f"{prefix}flags.{name}", env, "default" in spec)\n',
              '                yield Flag(\n                    f"{prefix}flags.{name}",\n                    env,\n                    "default" in spec,\n                    spec.get("argv", True) is not False,\n                )\n',
              'flag iterator',
          )
          text = replace_once(
              text,
              '        if secret_bearing:\n            errors.append(\n                f"{flag.path} exposes secret-bearing env {flag.env}; keep it environment-only"\n            )\n',
              '        if secret_bearing and flag.argv_enabled:\n            errors.append(\n                f"{flag.path} exposes secret-bearing env {flag.env} to argv; declare argv = false"\n            )\n',
              'secret argv policy',
          )
          path.write_text(text)

          test_path = Path('tests/test_consumer_compliance_policy.py')
          text = test_path.read_text()
          marker = '    def test_long_running_rust_consumer_cannot_load_contract_from_cwd(self) -> None:\n'
          addition = '''    def test_env_only_secret_flag_metadata_is_preserved(self) -> None:\n        [flag] = list(\n            MODULE.iter_flag_tables(\n                {\n                    "flags": {\n                        "database": {\n                            "env": "DATABASE_URL",\n                            "type": "string",\n                            "argv": False,\n                        }\n                    }\n                },\n                "",\n            )\n        )\n        self.assertFalse(flag.argv_enabled)\n        self.assertTrue(MODULE.is_secret_bearing_env(flag.env))\n\n'''
          text = replace_once(text, marker, addition + marker, 'policy unit test insertion')
          test_path.write_text(text)

          fixture = Path('tests/compliance/run.sh')
          text = fixture.read_text()
          marker = '''python3 "$CHECKER" \\\n  --root "$TMP_DIR/good" \\\n  --contract .cli-flags.toml \\\n  --parser-ref "$PARSER_REF" \\\n  --kind server \\\n  --rust-manifest Cargo.toml\n'''
          addition = marker + '''\ncp -R "$TMP_DIR/good" "$TMP_DIR/good-env-only-secret"\ncat >>"$TMP_DIR/good-env-only-secret/.cli-flags.toml" <<'EOF'\n\n[flags.database]\nenv = "DATABASE_URL"\ntype = "string"\nargv = false\nEOF\npython3 "$CHECKER" \\\n  --root "$TMP_DIR/good-env-only-secret" \\\n  --contract .cli-flags.toml \\\n  --parser-ref "$PARSER_REF" \\\n  --kind server \\\n  --rust-manifest Cargo.toml\n'''
          text = replace_once(text, marker, addition, 'env-only compliance fixture')
          fixture.write_text(text)
          PY
          git diff --check
      - name: Prove policy behavior
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/verify-consumer-compliance.py
          python3 -m unittest tests/test_consumer_compliance_policy.py
          bash tests/compliance/run.sh
          python3 scripts/verify-client-parser-sync.py --min-copies 20
      - name: Commit policy changes only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/verify-consumer-compliance.py tests/test_consumer_compliance_policy.py tests/compliance/run.sh
          git diff --cached --quiet && { echo 'policy already migrated'; exit 0; }
          git commit -m 'policy: allow typed env-only secret declarations'
          git push origin HEAD:DEN-391-env-only-argv-false
