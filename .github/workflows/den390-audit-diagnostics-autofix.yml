name: den390-audit-diagnostics-autofix

on:
  push:
    branches:
      - agent/flags2env-audit-diagnostics

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Reconcile stale diagnostic fixtures with current config vocabulary
        shell: bash
        run: |
          set -euo pipefail
          file=clients/rust/src/bundled.rs
          sed -i \
            -e 's/unknown config table \[identity\]/unknown config table [mystery]/g' \
            -e 's/\[identity\]\\nname = /[mystery]\\nname = /g' \
            -e 's#/// Regression: `shared-auth/shared-auth-admin-api-server.rs` and#/// Regression: an unknown table must remain actionable after `[identity]`#' \
            -e 's#/// `memebank/memebank-api-server.rs` ship an `\[identity\]` table, which the#/// became supported code-generation metadata. `[mystery]` is deliberately#' \
            -e 's#/// authored schema (`contracts/cli-flags-config/authored.schema.json`)#/// absent from the authored TypeSpec and JSON Schema authorities.#' \
            -e 's#/// has never declared\.##' \
            "$file"

      - name: Format Rust client
        run: cargo fmt --manifest-path clients/rust/Cargo.toml --all

      - name: Verify focused diff is clean
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff -- clients/rust/src/bundled.rs clients/rust/src/lib.rs

      - name: Commit normalization when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- clients/rust/src/bundled.rs clients/rust/src/lib.rs; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- clients/rust/src/bundled.rs clients/rust/src/lib.rs
          git commit -m 'fix(rust): replay audit diagnostics on current config contract'
          git push origin "HEAD:${GITHUB_REF_NAME}"
