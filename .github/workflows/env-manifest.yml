name: env-manifest

on:
  pull_request:
    paths:
      - 'clients/nodejs/env-manifest.mjs'
      - 'clients/nodejs/env-manifest.test.mjs'
      - 'clients/nodejs/cli.mjs'
      - 'docs/env-manifest.md'
      - 'package.json'
      - '.github/workflows/env-manifest.yml'
  push:
    branches: [main]
    paths:
      - 'clients/nodejs/env-manifest.mjs'
      - 'clients/nodejs/env-manifest.test.mjs'
      - 'clients/nodejs/cli.mjs'
      - 'docs/env-manifest.md'
      - 'package.json'
      - '.github/workflows/env-manifest.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: env-manifest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          show-progress: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.1'
          package-manager-cache: false
      - name: Syntax and deterministic env-manifest tests
        run: |
          node --check clients/nodejs/env-manifest.mjs
          node --check clients/nodejs/cli.mjs
          node --test clients/nodejs/env-manifest.test.mjs
      - name: Ensure package includes the env-manifest implementation
        shell: bash
        run: |
          set -euo pipefail
          npm pack --dry-run --json > "$RUNNER_TEMP/pack.json"
          node --input-type=module - "$RUNNER_TEMP/pack.json" <<'NODE'
          import { readFileSync } from 'node:fs';
          const path = process.argv[2];
          const result = JSON.parse(readFileSync(path, 'utf8'))[0];
          const files = new Set((result.files || []).map(x => x.path));
          for (const required of ['clients/nodejs/cli.mjs', 'clients/nodejs/env-manifest.mjs']) {
            if (!files.has(required)) throw new Error(`packed artifact missing ${required}`);
          }
          NODE
