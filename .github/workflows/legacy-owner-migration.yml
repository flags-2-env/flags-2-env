name: one-shot legacy owner migration

on:
  push:
    branches:
      - DEN-390-clean-legacy-owner-references-20260916
    paths:
      - .github/workflows/legacy-owner-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          ref: DEN-390-clean-legacy-owner-references-20260916
      - name: Canonicalize non-workflow owner references
        shell: bash
        env:
          RELEASE_SHA: 2946224fb3a1bd84c0e39146b24f5f1ca8d69862
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          release = os.environ["RELEASE_SHA"]
          canonical_files = [
              "tests/test_consumer_fleet.py",
              "tests/test_client_parser_sync.py",
              "tests/compliance/run.sh",
              "clients/golang/README.md",
              "clients/reasonml/dune-project",
              "clients/ocaml/dune-project",
              "scripts/test-readme-snippets.mjs",
              "scripts/publish-zed-compatibility.sh",
              "scripts/verify-consumer-compliance.py",
              "docs/consumer-compliance.md",
          ]
          for name in canonical_files:
              path = Path(name)
              text = path.read_text()
              text = text.replace("ORESoftware/flags-2-env", "flags-2-env/flags-2-env")
              text = text.replace("oresoftware/flags-2-env", "flags-2-env/flags-2-env")
              path.write_text(text)

          readme = Path("README.md")
          text = readme.read_text()
          text = text.replace(
              "[`ORESoftware/flags-2-env`](https://github.com/ORESoftware/flags-2-env)",
              f"[`ORESoftware/flags-2-env@{release}`](https://github.com/ORESoftware/flags-2-env?ref={release})",
          )
          text = text.replace(
              "`oresoftware/flags-2-env@0.3.0` was published separately from the exact same",
              "a compatibility Zed package at version `0.3.0` under the former `oresoftware` namespace was published separately from the exact same",
          )
          text = text.replace(
              "`oresoftware/flags-2-env@^0.3` resolves a separately published artifact from",
              "the former `oresoftware` namespace at `^0.3` resolves a separately published artifact from",
          )
          text = text.replace(
              "github.com/oresoftware/flags-2-env/clients/golang",
              "github.com/flags-2-env/flags-2-env/clients/golang",
          )
          readme.write_text(text)

          allow = Path(".legacy-owner-reference-allowlist.json")
          data = json.loads(allow.read_text())
          paths = set(data.get("paths", []))
          paths.update({
              "docs/source-migration.md",
              "docs/source-migration.json",
              "docs/source-migration.schema.json",
              "scripts/verify-source-migration.py",
              ".github/workflows/legacy-owner-migration.yml",
              ".github/workflows/downstream-consumers.yml",
              ".github/workflows/den-3096-repair.yml",
          })
          data["paths"] = sorted(paths)
          data["policy"] = (
              "Historical migration authorities may name the former owner. The three workflow paths are temporary migration exceptions and must be removed from this allowlist before merge. Runtime manifests, package metadata, client imports, and active consumer documentation are not allowlisted."
          )
          allow.write_text(json.dumps(data, indent=2, sort_keys=True) + "\n")
          PY

          python3 scripts/audit-legacy-owner-references.py --self-test
          python3 scripts/audit-legacy-owner-references.py . --json > /tmp/legacy-owner-audit.json
          cat /tmp/legacy-owner-audit.json
          python3 - <<'PY'
          import json
          report = json.load(open('/tmp/legacy-owner-audit.json'))
          assert report['forbidden_count'] == 0, report
          print(f"intermediate migration audit clean: findings={len(report['findings'])} forbidden=0")
          PY
          git diff --check
      - name: Commit non-workflow migration result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md .legacy-owner-reference-allowlist.json tests clients scripts docs
          git diff --cached --quiet && { echo 'no non-workflow migration changes'; exit 0; }
          git commit -m 'migration: canonicalize historical owner references'
          git push origin HEAD:DEN-390-clean-legacy-owner-references-20260916
