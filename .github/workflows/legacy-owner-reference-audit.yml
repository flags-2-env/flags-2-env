name: legacy owner reference audit

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python3 scripts/audit-legacy-owner-references.py --self-test
      - run: python3 scripts/audit-legacy-owner-references.py . --json
