name: DEN-3173 one-use PHP README materializer

on:
  push:
    branches:
      - agent/den-3173-php-readme-portability

permissions:
  contents: write

concurrency:
  group: den-3173-php-readme-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
          persist-credentials: true
          show-progress: false

      - name: Apply the bounded documentation and harness repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          readme_path = Path("README.md")
          readme = readme_path.read_text()
          old_readme = "$f2e = new Flags2Env(__DIR__ . '/build/libflags2env.dylib');"
          new_readme = """$nativeLibrary = getenv('FLAGS2ENV_NATIVE_LIB') ?: match (PHP_OS_FAMILY) {
              'Darwin' => __DIR__ . '/build/libflags2env.dylib',
              'Windows' => __DIR__ . '/build/flags2env.dll',
              default => __DIR__ . '/build/libflags2env.so',
          };
          $f2e = new Flags2Env($nativeLibrary);"""
          count = readme.count(old_readme)
          if count != 2:
              raise SystemExit(f"expected exactly two PHP README paths, found {count}")
          readme_path.write_text(readme.replace(old_readme, new_readme))

          test_path = Path("scripts/test-readme-snippets.mjs")
          test_source = test_path.read_text()
          old_test = '''  run("PHP README snippet", "php", ["-d", "ffi.enable=true", join(dir, "snippet.php"), "--debug=t", "--port", "8181"], { cwd: dir });'''
          new_test = '''  run("PHP README snippet", "php", ["-d", "ffi.enable=true", join(dir, "snippet.php"), "--debug=t", "--port", "8181"], {
            cwd: dir,
            env: { FLAGS2ENV_NATIVE_LIB: sharedLib },
          });'''
          count = test_source.count(old_test)
          if count != 1:
              raise SystemExit(f"expected exactly one PHP README test invocation, found {count}")
          test_path.write_text(test_source.replace(old_test, new_test))
          PY

          node --check scripts/test-readme-snippets.mjs
          grep -Fq "FLAGS2ENV_NATIVE_LIB" README.md
          grep -Fq "FLAGS2ENV_NATIVE_LIB: sharedLib" scripts/test-readme-snippets.mjs
          git diff --check

      - name: Remove the one-use carrier and publish the product commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/materialize-den-3173-php-readme.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md scripts/test-readme-snippets.mjs .github/workflows/materialize-den-3173-php-readme.yml
          git diff --cached --check
          git commit -m "docs(DEN-3173): make PHP native library path portable"
          git push origin "HEAD:${GITHUB_REF_NAME}"
