name: DEN-3173 one-use Rust README materializer

on:
  push:
    branches:
      - agent/den-3173-php-readme-portability

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact producer branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
          persist-credentials: true
          show-progress: false

      - name: Apply the bounded Rust documentation repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("README.md")
          source = path.read_text()
          old = '    let sdk = unsafe { Flags2Env::load(Some("./build/libflags2env.dylib"))? };\n'
          new = '    let native_library = env::var("FLAGS2ENV_NATIVE_LIB").ok();\n    let sdk = unsafe { Flags2Env::load(native_library.as_deref())? };\n'
          count = source.count(old)
          if count != 1:
              raise SystemExit(f"expected exactly one Rust dynamic-loader example, found {count}")
          path.write_text(source.replace(old, new))
          PY
          grep -Fq 'Flags2Env::load(native_library.as_deref())' README.md
          git diff --check

      - name: Remove carrier and publish the product commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/materialize-den-3173-rust-readme.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/workflows/materialize-den-3173-rust-readme.yml
          git diff --cached --check
          git commit -m "docs(DEN-3173): use the platform Rust loader"
          git push origin "HEAD:${GITHUB_REF_NAME}"
