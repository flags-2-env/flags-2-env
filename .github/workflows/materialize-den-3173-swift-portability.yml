name: DEN-3173 one-use Swift README materializer

on:
  push:
    branches:
      - agent/den-3173-php-readme-portability

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
          persist-credentials: true
          show-progress: false

      - name: Apply and validate the bounded repair
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/.tmp-den-3173-swift-portability.py
          python3 scripts/.tmp-den-3173-swift-portability.py
          node --check scripts/test-readme-snippets.mjs
          test "$(grep -Fc 'FLAGS2ENV_NATIVE_LIB' README.md)" -ge 4
          grep -Fq 'FLAGS2ENV_NATIVE_LIB: sharedLib' scripts/test-readme-snippets.mjs
          git diff --check

      - name: Remove carriers and publish product-only commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/materialize-den-3173-swift-portability.yml
          rm -f scripts/.tmp-den-3173-swift-portability.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md scripts/test-readme-snippets.mjs .github/workflows/materialize-den-3173-swift-portability.yml scripts/.tmp-den-3173-swift-portability.py
          git diff --cached --check
          git commit -m "docs(DEN-3173): make Swift native-library paths portable"
          git push origin "HEAD:${GITHUB_REF_NAME}"
