name: Oreslang native C ABI
on:
  push:
    branches: ["feat/oreslang-c-ffi-20261009"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-test-abi:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: make oreslang-abi-test
      - if: runner.os == 'Linux'
        run: |
          make oreslang-abi-shared
          nm -D build/libflags2env_oreslang.so | grep -F f2e_oreslang_parse_json_file

      - if: runner.os == 'Linux'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - if: runner.os == 'Linux'
        name: Run real Java/Graal JNI bridge smoke
        run: |
          make oreslang-abi-jni
          javac -d build/oreslang-jni-test clients/oreslang/tests/Flags2EnvNative.java
          java -Djava.library.path=build -cp build/oreslang-jni-test \
            dev.oreslang.runtime.Flags2EnvNative clients/oreslang/tests/flags.toml
