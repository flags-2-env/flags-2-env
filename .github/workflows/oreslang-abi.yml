name: Oreslang native C ABI
on:
  push:
    branches: ["feat/oreslang-c-ffi-20261009"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-test-abi:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: make oreslang-abi-test
      - if: runner.os == 'Linux'
        run: |
          make oreslang-abi-shared
          nm -D build/libflags2env_oreslang.so | grep -F f2e_oreslang_parse_json_file
