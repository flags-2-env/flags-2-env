name: Oreslang client contract

on:
  pull_request:
    paths:
      - "clients/oreslang/**"
      - "contracts/oreslang-client-backends.v1.json"
      - "src/parser.c"
      - "src/parser.h"
      - ".github/workflows/oreslang-client.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact checkout
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Verify vendored parser identity
        run: |
          set -euo pipefail
          cmp -s src/parser.c clients/oreslang/native/parser.c
          cmp -s src/parser.h clients/oreslang/native/parser.h
      - name: Build hardened Oreslang native bridge
        run: |
          set -euo pipefail
          cc -std=c99 -Wall -Wextra -Wpedantic -Werror -O2 \
            -Isrc -Iclients/oreslang/native \
            clients/oreslang/native/parser.c \
            clients/oreslang/native/flags2env_ores_bridge.c \
            clients/oreslang/native/bridge_test.c \
            -o "$RUNNER_TEMP/flags2env-oreslang-bridge-test"
      - name: Execute native bridge tests
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/flags2env-oreslang-bridge-test"
      - name: Build and execute Oreslang bridge fault-boundary tests
        run: |
          set -euo pipefail
          cc -std=c99 -Wall -Wextra -Wpedantic -Werror -O2 \
            -Iclients/oreslang/native \
            clients/oreslang/native/flags2env_ores_bridge.c \
            clients/oreslang/native/bridge_fault_test.c \
            -o "$RUNNER_TEMP/flags2env-oreslang-bridge-fault-test"
          "$RUNNER_TEMP/flags2env-oreslang-bridge-fault-test"
      - name: Verify Oreslang source contract
        run: |
          set -euo pipefail
          node clients/oreslang/tests/source_contract.mjs
      - name: Verify Oreslang publish plan is source-only and namespaced
        env:
          PACKAGE_VERSION: 0.1.0
        run: |
          set -euo pipefail
          output="$(sh clients/oreslang/publish.sh --dry-run)"
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -Fq 'clients/oreslang/v${PACKAGE_VERSION:?set PACKAGE_VERSION}'
