name: Temporary diagnostics rustfmt

on:
  push:
    branches:
      - fix/specific-invocation-diagnostics

permissions:
  contents: write

jobs:
  fmt:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/specific-invocation-diagnostics
          persist-credentials: true

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          components: rustfmt

      - name: Apply rustfmt
        shell: bash
        run: cargo fmt --all

      - name: Verify formatter scope
        shell: bash
        run: |
          set -euo pipefail
          unexpected="$(git diff --name-only | grep -Ev '^(clients/rust/src/lib\.rs|clients/rust/tests/diagnostics\.rs)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "rustfmt touched unexpected files:" >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi

      - name: Commit canonical formatting when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- clients/rust/src/lib.rs clients/rust/tests/diagnostics.rs; then
            echo "already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clients/rust/src/lib.rs clients/rust/tests/diagnostics.rs
          git commit -m "style(rust): apply cargo fmt"
          git push origin HEAD:fix/specific-invocation-diagnostics
