[package]
org = "flags-2-env"
name = "flags-2-env"
version = "0.3.1"
description = "Portable nested CLI flag-to-environment parser and polyglot bindings"
license = "MIT"
keywords = ["cli", "flags", "environment", "polyglot"]

[package.repository]
vcs = "git"
url = "https://github.com/flags-2-env/flags-2-env"

# Package-level environment contract. `.cli-flags.toml` remains authoritative
# for flag aliases and flag -> env normalization; this section declares the env
# surface the package itself accepts so zed-pkg and ores-cli can validate it.
[env]
strict = true

[[env.vars]]
name = "FLAGS2ENV_CONFIG"
type = "string"
description = "Path to the .cli-flags.toml file."

[[env.vars]]
name = "FLAGS2ENV_NATIVE_LIB"
type = "string"
description = "Path to the native flags2env shared library."

[[env.vars]]
name = "FLAGS2ENV_NODE_ADDON"
type = "string"
description = "Path to the Node native addon."

[[env.vars]]
name = "FLAGS2ENV_RUNTIME"
type = "string"
description = "Runtime client target."

[[env.vars]]
name = "FLAGS2ENV_AUDIT"
type = "boolean"
description = "Enable client audit mode."

[[env.vars]]
name = "FLAGS2ENV_ALLOW_UNKNOWN"
type = "boolean"
description = "Allow unrecognized flags to pass through to downstream code."

[publish]
include_readme = true
tag_format = "v{version}"
smoke_test = "sh \"$ZED_PKG_TEST_TARGET/scripts/verify-zed-package.sh\" \"$ZED_PKG_TEST_TARGET\""
exclude = [
  ".build/**",
  "clients/**/.dart_tool/**",
  "clients/**/.gradle/**",
  "clients/**/.zig-cache/**",
  "clients/**/_build/**",
  "clients/**/build/**",
  "clients/**/dist/**",
  "clients/**/target/**",
  # generated client lockfiles: resolved locally, never a release input
  "clients/dart/pubspec.lock",
  "clients/rust/Cargo.lock",
  # zed's own local pack staging directory
  ".zed/**",
]

[build]
command = "make cli"
outputs = [
  "build/flags2env",
  "clients/bash/flags2env.bash",
  "clients/zsh/flags2env.zsh",
  "scripts/verify-zed-package.sh",
  "scripts/verify-shell-contract.py",
  ".cli-flags.toml",
]

[bin]
flags2env = "build/flags2env"

[install]
adapter = "none"

[scripts]
test = "make test"
